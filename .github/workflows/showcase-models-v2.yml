name: showcase-models-v2

on:
  push:
    branches: [ feature/cinefx-1.21.11 ]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[models-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cinefx-1.21.11
      - name: Generate detailed showcase glTF models
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          payload = ''''''
          open('/tmp/generate_models.py','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/generate_models.py
          rm .github/workflows/showcase-models-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/assets/cinefx/cinefx/models/*.gltf .github/workflows/showcase-models-v2.yml
          git commit -m 'feat: replace showcase placeholders with detailed glTF models [models-v2]'
          git push origin HEAD:feature/cinefx-1.21.11
