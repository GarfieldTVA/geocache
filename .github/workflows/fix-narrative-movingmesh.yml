name: fix-narrative-movingmesh

on:
  push:
    branches: [ feature/cinefx-1.21.11 ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cinefx-1.21.11
      - name: Fix extra movingMesh parentheses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fixes = {
              'src/main/java/dev/garfield/cinefx/showcase/ChronoNarrative.java': [
                  ('new Vec3d(0.95, 0.95, 0.95), 0xFFC2FBFF, 0.62, "crystal", 8));', 'new Vec3d(0.95, 0.95, 0.95), 0xFFC2FBFF, 0.62, "crystal", 8);'),
                  ('new Vec3d(0.9, 0.9, 0.9), 0xFFFF92E5, 0.55, "crystal", -9));', 'new Vec3d(0.9, 0.9, 0.9), 0xFFFF92E5, 0.55, "crystal", -9);'),
                  ('new Vec3d(0.78, 0.78, 0.78), 0xFF71F7FF, 0.72, "crystal", 14));', 'new Vec3d(0.78, 0.78, 0.78), 0xFF71F7FF, 0.72, "crystal", 14);'),
                  ('new Vec3d(0.85, 0.85, 0.85), 0xFFFF8EE2, 0.62, "crystal", -7));', 'new Vec3d(0.85, 0.85, 0.85), 0xFFFF8EE2, 0.62, "crystal", -7);'),
                  ('new Vec3d(0.75, 0.75, 0.75), 0xFFFF94E5, 0.72, "crystal", 0));', 'new Vec3d(0.75, 0.75, 0.75), 0xFFFF94E5, 0.72, "crystal", 0);'),
              ],
              'src/main/java/dev/garfield/cinefx/showcase/StarfallNarrative.java': [
                  ('new Vec3d(0.8, 0.8, 0.8), 0xFFBDF8FF, 0.38, "crystal", side * 5));', 'new Vec3d(0.8, 0.8, 0.8), 0xFFBDF8FF, 0.38, "crystal", side * 5);'),
                  ('route(760, passes[i]), new Vec3d(1.6, 1.6, 1.6), 0xFF9CB8FF, 0.28, "ship", i % 2 == 0 ? -14 : 14));', 'route(760, passes[i]), new Vec3d(1.6, 1.6, 1.6), 0xFF9CB8FF, 0.28, "ship", i % 2 == 0 ? -14 : 14);'),
                  ('new Vec3d(1.8, 1.8, 1.8), 0xFFFFB08A, 0.5, "ship", 24));', 'new Vec3d(1.8, 1.8, 1.8), 0xFFFFB08A, 0.5, "ship", 24);'),
                  ('new Vec3d(0.9, 0.9, 0.9), 0xFF9EFFFF, 0.55, "crystal", i % 2 == 0 ? 12 : -12));', 'new Vec3d(0.9, 0.9, 0.9), 0xFF9EFFFF, 0.55, "crystal", i % 2 == 0 ? 12 : -12);'),
                  ('new Vec3d(1.5, 1.5, 1.5), 0xFF7DF6FF, 0.72, "ship", side * 18));', 'new Vec3d(1.5, 1.5, 1.5), 0xFF7DF6FF, 0.72, "ship", side * 18);'),
              ],
              'src/main/java/dev/garfield/cinefx/showcase/TitanNarrative.java': [
                  ('new Vec3d(0.72, 0.72, 0.72), 0xFFFFD09A, 0.32, "crystal", 5));', 'new Vec3d(0.72, 0.72, 0.72), 0xFFFFD09A, 0.32, "crystal", 5);'),
                  ('new Vec3d(0.85, 0.85, 0.85), 0xFF9DF4FF, 0.52, "crystal", 9));', 'new Vec3d(0.85, 0.85, 0.85), 0xFF9DF4FF, 0.52, "crystal", 9);'),
              ],
          }
          changed = 0
          for name, replacements in fixes.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly 1 occurrence of {old!r}, got {count}')
                  s = s.replace(old, new, 1)
                  changed += 1
              p.write_text(s, encoding='utf-8')
          if changed != 12:
              raise SystemExit(f'Expected 12 fixes, got {changed}')
          print('Fixed 12 narrative movingMesh call endings')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/garfield/cinefx/showcase/ChronoNarrative.java src/main/java/dev/garfield/cinefx/showcase/StarfallNarrative.java src/main/java/dev/garfield/cinefx/showcase/TitanNarrative.java
          git commit -m 'Fix narrative movingMesh syntax [skip ci]'
          git push origin HEAD:feature/cinefx-1.21.11
