name: fix-zeropoint-narrative

on:
  push:
    branches: [ feature/cinefx-1.21.11 ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cinefx-1.21.11
      - name: Fix extra parenthesis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/dev/garfield/cinefx/showcase/ZeroPointNarrative.java')
          s = p.read_text(encoding='utf-8')
          old = '                    new Vec3d(0.9, 0.9, 0.9), 0xFFAEF8FF, 0.55, "crystal", 10));'
          new = '                    new Vec3d(0.9, 0.9, 0.9), 0xFFAEF8FF, 0.55, "crystal", 10);'
          if old not in s:
              raise SystemExit('Expected ZeroPoint movingMesh line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/garfield/cinefx/showcase/ZeroPointNarrative.java
          git commit -m 'Fix ZeroPoint narrative drone syntax [skip ci]'
          git push origin HEAD:feature/cinefx-1.21.11
