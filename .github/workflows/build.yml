name: CineFX build

on:
  push:
    branches:
      - feature/cinefx-1.21.11
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: bash ./gradlew build

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinefx-1.21.11
          path: build/libs/*.jar
          if-no-files-found: ignore
